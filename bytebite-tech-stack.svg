    <text x="1313" y="449" text-anchor="middle" font-size="24" fill="#315438">PostgreSQL</text>

    <line x1="386" y1="402" x2="455" y2="402" stroke="#315438" stroke-width="5" marker-end="url(#arrow)"/>
    <line x1="743" y1="402" x2="812" y2="402" stroke="#315438" stroke-width="5" marker-end="url(#arrow)"/>
    <line x1="1100" y1="402" x2="1169" y2="402" stroke="#315438" stroke-width="5" marker-end="url(#arrow)"/>

