    <text x="956" y="449" text-anchor="middle" font-size="24" fill="#315438">Express API</text>

    <rect x="1189" y="304" width="248" height="196" rx="20" fill="#F4B6A6" stroke="#315438" stroke-width="4"/>
    <text x="1313" y="367" text-anchor="middle" font-size="31" font-weight="800" fill="#24422E">Database</text>
