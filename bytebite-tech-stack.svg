    <text x="360" y="660" text-anchor="middle" font-size="28" font-weight="800" fill="#24422E">Authentication</text>
    <text x="360" y="699" text-anchor="middle" font-size="23" fill="#315438">JWT tokens + protected routes</text>

    <rect x="632" y="615" width="336" height="112" rx="18" fill="#FFFFFF" stroke="#D8E1C8" stroke-width="3"/>
    <text x="800" y="660" text-anchor="middle" font-size="28" font-weight="800" fill="#24422E">Testing</text>
