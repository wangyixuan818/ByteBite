<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FFF8EA"/>
  <rect x="72" y="58" width="1456" height="784" rx="28" fill="#FEFDF7" stroke="#D8E1C8" stroke-width="4"/>
  <text x="800" y="126" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800" fill="#24422E">ByteBite Current Tech Stack</text>
  <text x="800" y="174" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" fill="#687866">From user action to stored fridge data</text>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#315438" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="118" y="304" width="248" height="196" rx="20" fill="#F7D774" stroke="#315438" stroke-width="4"/>
    <text x="242" y="367" text-anchor="middle" font-size="31" font-weight="800" fill="#24422E">Browser UI</text>
    <text x="242" y="412" text-anchor="middle" font-size="24" fill="#315438">React</text>
    <text x="242" y="449" text-anchor="middle" font-size="24" fill="#315438">Vite</text>

    <rect x="475" y="304" width="248" height="196" rx="20" fill="#BFDDB8" stroke="#315438" stroke-width="4"/>
    <text x="599" y="367" text-anchor="middle" font-size="31" font-weight="800" fill="#24422E">API Client</text>
    <text x="599" y="412" text-anchor="middle" font-size="24" fill="#315438">Axios</text>
    <text x="599" y="449" text-anchor="middle" font-size="24" fill="#315438">REST calls</text>

    <rect x="832" y="304" width="248" height="196" rx="20" fill="#C9E4E7" stroke="#315438" stroke-width="4"/>
    <text x="956" y="367" text-anchor="middle" font-size="31" font-weight="800" fill="#24422E">Backend</text>
